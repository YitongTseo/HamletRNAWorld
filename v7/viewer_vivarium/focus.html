<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/static/palette.js?v=3"></script>
    <title>wormlet — specimen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/focus.css?v=6">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-page="worms" data-header="overlay">
    <script src="/static/header.js?v=1"></script>
    <canvas id="c"></canvas>
    <canvas id="textcanvas"></canvas>
    <div id="specimen-card">
      <div class="binom">Caenorhabditis hamletensis</div>
      <div class="srow" data-row="words">words ingested <b>0</b></div>
      <div class="srow" data-row="satiety">satiety <b>—</b></div>
      <div class="srow" data-row="learning">learning Δ <b>—</b></div>
      <div class="srow ing" data-row="ingested">recently ingested<br><b>…</b></div>
    </div>
    <div id="netpanel"><canvas id="netcanvas"></canvas></div>
    <div id="radarpanel"><canvas id="radarcanvas"></canvas></div>
    <div id="chemosensoryPanel"></div>
    <div id="hud">connecting…</div>
    <!-- The specimen's name only. Site chrome (title, nav, tombstone, the
         experiment switcher) is the shared #site-header in overlay mode —
         this page used to hand-roll its own nav, which is why the chrome
         changed as soon as you clicked into a worm. -->
    <div id="title-nav-wrap">
      <div id="wormtitle"></div>
    </div>
    <script src="/static/experiment_dropdown.js?v=2"></script>
    <script>
      // Provisional title from the URL (slug form); the first WS frame
      // carries the worm's TRUE name (msg.name) and focus/index.js corrects
      // it — so "dowager-cixi" in the URL still titles as "dowager cixi".
      const wormName = decodeURIComponent(location.pathname.split('/').pop() || '');
      document.getElementById('wormtitle').textContent = wormName.replace(/-/g, ' ');
      document.title = `wormlet — ${wormName.replace(/-/g, ' ')}`;
    </script>
    <script type="module" src="/static/focus/index.js?v=7"></script>
  </body>
</html>
