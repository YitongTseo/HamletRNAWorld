# Board publish pipeline (2026-07-30): git is code-only now; the winning worm of
# each generation is published to board_publish/ and served at /board over the
# tunnel. See server/board_publish.py.
[Service]
Environment=WORMLET_GIT_COMMIT=0
Environment=WORMLET_BOARD_PUBLISH=1
Environment=WORMLET_BOARD_PUBLISH_DIR=/home/web/board_publish
