# Lifelike mode (2026-09-01). Within-lifetime plasticity, hunger/satiety with
# starvation death, and chemosensory habituation. poetry-4 is deliberately
# left stock as the control arm — do not add this file there without
# recording why, or the comparison is lost.
#
# These lineages predate the feature, so their parent_keys carry no _lifelike
# gene block: the worms run the clipped DEFAULT rule params and evolution
# never tunes them. Only a cold-started lineage (fresh WORMLET_DATA_DIR with
# the flags already on) searches the learning rules themselves.
[Service]
Environment=WORMLET_PLASTICITY=1
Environment=WORMLET_HUNGER=1
Environment=WORMLET_HABITUATION=1
