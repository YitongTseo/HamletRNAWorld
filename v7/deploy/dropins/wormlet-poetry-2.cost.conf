# API cost controls (2026-09-21). Nothing here changes what the worms DO, and
# nothing here changes a single fitness score — only how much of each epoch we
# pay a model to look at.
#
# The meta-gardener is three Opus calls per epoch, each carrying every worm's
# metrics, and nothing selects on its output: the log is prose. Every 2nd epoch
# halves that bill. The gardener's own PASS ("rested") is untouched and still
# means the gardener chose not to write; an epoch skipped by this setting is
# recorded as gardeners_log.deferred so the two are never confused.
#
# Judge sampling is deliberately NOT cut here. It is the obvious lever and the
# wrong one to pull while common random numbers (2026-09-01) are being measured
# — fewer windows add judge noise in exactly the generations CRN is removing
# it from, and afterwards neither effect can be read. WORMLET_JUDGE_SAMPLE_
# FRACTION still exists if that changes; see server/judge.py for the NZD
# figures and the warning.
[Service]
Environment=WORMLET_GARDENER_EVERY_N_EPOCHS=2
