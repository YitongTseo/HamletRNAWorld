<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/static/palette.js?v=2"></script>
    <title>wormlet — focus</title>
    <link rel="stylesheet" href="/static/focus.css?v=6">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-page="worms" data-header="overlay">
    <script src="/static/header.js?v=1"></script>
    <canvas id="c"></canvas>
    <canvas id="textcanvas"></canvas>
    <div id="netpanel"><canvas id="netcanvas"></canvas></div>
    <div id="radarpanel"><canvas id="radarcanvas"></canvas></div>
    <div id="chemosensoryPanel"></div>
    <div id="hud">connecting…</div>
    <!-- The specimen's name only. Site chrome (title, nav, tombstone, the
         experiment switcher) is the shared #site-header in overlay mode —
         this page used to hand-roll its own nav, which is why the chrome
         changed as soon as you clicked into a worm. -->
    <div id="title-nav-wrap">
      <div id="wormtitle"></div>
    </div>
    <script src="/static/experiment_dropdown.js?v=1"></script>
    <script>
      // Show worm name in the title.
      const wormName = decodeURIComponent(location.pathname.replace(/^\/focus\//, '').replace(/\/$/, ''));
      document.getElementById('wormtitle').textContent = wormName;
      document.title = `wormlet — ${wormName}`;
    </script>
    <script type="module" src="/static/focus/index.js?v=6"></script>
  </body>
</html>
