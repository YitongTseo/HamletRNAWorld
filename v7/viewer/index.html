<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/static/palette.js?v=3"></script>
    <title>wormlet — vivarium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      :root {
        /* This page names its colours after the bench, not the palette, and
           for a while that meant it was the ONE page that ignored the theme:
           --bench/--ivory/--ochre were hardcoded tobacco, so the overview
           stayed brown on the experiment subdomains while every other page
           reshaded. They are aliases now; the literals are only the fallback
           for a palette.js that failed to load. */
        --bench: var(--bg, #292118); --glass: var(--panel, #211a12);
        --ivory: var(--fg, #ece2cd); --ochre: var(--accent, #cfa348);
        --warn: var(--hot, #e0503f);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bench); color: var(--ivory); }
      body { font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 13px; }
      #status { padding: 8px 34px 0; color: var(--dim); font-size: 10.5px; letter-spacing: 0.14em; }
      #grid { padding: 6px 34px 46px; }
    </style>
  </head>
  <body data-page="worms">
    <script src="/static/header.js?v=1"></script>
    <div id="status">connecting…</div>
    <div id="grid"></div>
    <script src="/static/experiment_dropdown.js?v=2"></script>
    <script src="/static/index.js?v=6"></script>
  </body>
</html>
