<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/static/palette.js?v=2"></script>
    <title>wormlet — observation log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500&family=Inter+Tight:wght@300;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bench: #08090b; --glass: #10141a; --ivory: #e8e4da;
        --dim: #5c646e; --cyan: #6ad1e0; --warn: #e0503f;
        /* legacy vars some shared scripts read */
        --bg: #08090b; --fg: #e8e4da; --accent: #6ad1e0;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bench); color: var(--ivory); }
      body { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; }
      header {
        display: flex; align-items: baseline; justify-content: space-between; gap: 18px;
        padding: 22px 34px 16px; border-bottom: 1px solid #1a1f26;
      }
      header h1 {
        margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 300;
        font-size: 16px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--ivory);
      }
      header h1 b { font-weight: 500; color: var(--cyan); }
      header h1 small { font-weight: 300; font-size: 10px; letter-spacing: 0.08em;
        color: var(--dim); margin-left: 14px; text-transform: none; }
      header h1 small a { color: var(--dim); }
      header nav { font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; }
      header nav a { color: var(--dim); text-decoration: none; padding: 4px 8px; }
      header nav a:hover { color: var(--cyan); }
      #status { padding: 8px 34px 0; color: var(--dim); font-size: 10.5px; letter-spacing: 0.14em; }
      #grid { padding: 6px 34px 46px; }
    </style>
  </head>
  <body>
    <header>
      <h1>WORMLET <b>OBSERVATION LOG</b>
        <small>an experiment by <a href="https://www.ternalbiota.com" target="_blank" rel="noopener">Yitong</a></small></h1>
      <nav><a href="/poems">poems</a><a href="/generations">generations</a><a href="/about">about</a></nav>
      <div id="experiment-switcher"></div>
    </header>
    <div id="status">connecting…</div>
    <div id="grid"></div>
    <script src="/static/experiment_dropdown.js?v=1"></script>
    <script src="/static/index.js?v=6"></script>
  </body>
</html>
