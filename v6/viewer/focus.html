<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wormlet — focus</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
      #c { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 8px; left: 10px;
        max-width: calc(100vw - 240px);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #6f6; opacity: 0.7; pointer-events: none;
        text-shadow: 0 0 4px #0f0a;
        z-index: 12;
      }
      #help {
        position: fixed; bottom: 8px; left: 10px;
        font: 11px/1.35 ui-monospace, monospace; color: #5a5; opacity: 0.5;
      }
      #netcanvas {
        position: fixed; bottom: 8px; right: 10px;
        width: 500px; height: 360px;
        background: rgba(0, 10, 0, 0.75);
        border: 1px solid rgba(68, 255, 119, 0.3);
        pointer-events: none; z-index: 10;
      }
      #chemosensoryPanel {
        position: fixed; bottom: 8px; left: 10px;
        width: 320px; max-height: 600px;
        background: rgba(0, 10, 10, 0.85);
        border: 1px solid rgba(100, 200, 255, 0.4);
        color: #6f9; font: 11px ui-monospace, monospace;
        padding: 8px; overflow-y: auto;
        pointer-events: none; z-index: 10;
        line-height: 1.4;
      }
      #chemosensoryPanel .neuron { margin: 4px 0; padding: 3px 4px; border-radius: 2px; font-weight: bold; }
      #chemosensoryPanel .word { margin: 2px 0; padding: 2px 4px; font-size: 10px; }
      #textcanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }
      #radarcanvas {
        position: fixed;
        top: 60px;
        right: 10px;
        width: 460px;
        height: 280px;
        background: rgba(8, 12, 18, 0.9);
        border: 1px solid rgba(100, 200, 255, 0.3);
        pointer-events: none;
        z-index: 11;
        display: none;
      }
      #nav {
        position: fixed; top: 8px; right: 12px;
        font: 12px ui-monospace, monospace; color: #6f9; opacity: 0.85;
        z-index: 20;
      }
      #nav a { color: #6f9; text-decoration: none; padding: 4px 8px; }
      #nav a:hover { background: rgba(100, 200, 255, 0.15); }
      #wormtitle {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
        font: 14px ui-monospace, monospace; color: #afa; opacity: 0.8;
        text-shadow: 0 0 4px #0f0a; z-index: 20;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <canvas id="textcanvas"></canvas>
    <canvas id="netcanvas"></canvas>
    <canvas id="radarcanvas"></canvas>
    <div id="chemosensoryPanel"></div>
    <div id="hud">connecting…</div>
    <div id="wormtitle"></div>
    <div id="nav"><a href="/">← all worms</a><a href="/poems">poems</a><a href="/about">about</a><a href="https://www.ternalbiota.com" target="_blank" rel="noopener" style="opacity:0.55; font-size:11px;">by Yitong</a></div>
    <div id="help">press 'c' chemo · 'n' network · 'x' x-ray ↔ graph · 'l' neuron labels · 'o' smells · 'e' emotion radar</div>
    <script>
      // Show worm name in the title.
      const wormName = decodeURIComponent(location.pathname.replace(/^\/focus\//, '').replace(/\/$/, ''));
      document.getElementById('wormtitle').textContent = wormName;
      document.title = `wormlet — ${wormName}`;
    </script>
    <script type="module" src="/static/focus/index.js?v=3"></script>
  </body>
</html>
