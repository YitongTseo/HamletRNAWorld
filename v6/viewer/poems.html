<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wormlet · poems</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #afa; }
      body { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; flex-direction: column; }
      header {
        display: flex; justify-content: space-between; align-items: baseline;
        padding: 12px 18px 6px 18px;
      }
      header h1 { margin: 0; font-size: 16px; color: #6f9; }
      header nav a { color: #6f9; text-decoration: none; padding: 4px 8px; margin-left: 4px; }
      header nav a:hover { background: rgba(100,200,255,0.15); }
      #columns {
        flex: 1; display: flex; flex-direction: column; gap: 16px;
        padding: 4px 18px 18px 18px; overflow: auto; min-height: 0;
      }
      .flask-wrap { display: flex; flex-direction: column; min-height: 240px; }
      .flask-head {
        margin: 0 0 6px 0; font-size: 12px; font-weight: 600;
        color: #6f9; letter-spacing: 0.5px;
      }
      .flask-grid {
        display: grid; gap: 10px; flex: 1; min-height: 0;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .col {
        display: flex; flex-direction: column;
        background: rgba(0, 20, 10, 0.5);
        border: 1px solid rgba(100, 200, 255, 0.18);
        border-radius: 4px;
        overflow: hidden; min-height: 0;
      }
      .col-head {
        padding: 6px 10px; border-bottom: 1px solid rgba(100,200,255,0.12);
        display: flex; justify-content: space-between;
        color: #6f9; font-weight: 600;
      }
      .col-head .count { color: #5a5; font-weight: 400; font-size: 11px; }
      .col-body {
        flex: 1; overflow-y: auto; padding: 8px 10px; min-height: 0;
        scroll-behavior: smooth;
      }
      .col-body .word { padding: 2px 0; opacity: 0.85; }
      .col-body .word.newest { color: #cfc; opacity: 1; text-shadow: 0 0 6px #6f9; }
      #status { padding: 4px 18px; color: #5a5; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <h1>wormlet · poems <span style="opacity:0.55; font-weight:400; font-size:12px;">— created by <a href="https://www.ternalbiota.com" target="_blank" rel="noopener" style="color:#6f9; text-decoration:underline;">Yitong</a></span></h1>

    </header>
    <div id="status">loading…</div>
    <div id="columns"></div>
